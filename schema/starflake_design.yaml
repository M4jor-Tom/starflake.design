---
id: https://w3id.org/M4jor-Tom/starflake-design
name: starflake-design
title: Starflake design
description: |-
  Gameplay specification for Starflake: what the player does, what the player
  sees, and the constants that shape how it feels. Reuses the types of the
  pinned Starflake ontology and never redefines its terms.

  Units: distances in metres, time in seconds, angles in radians.

prefixes:
  starflake_design: https://w3id.org/M4jor-Tom/starflake-design/
  linkml: https://w3id.org/linkml/
default_prefix: starflake_design
default_range: string

imports:
  - linkml:types
  - ../.ontology/src/starflake_ontology/schema/starflake_ontology

classes:

  ControlScheme:
    tree_root: true
    description: How the player does things. Every action the game listens for.
    attributes:
      actions:
        description: The input actions, each with its default bindings.
        range: ControlAction
        required: true
        multivalued: true
        inlined_as_list: true

  ControlAction:
    description: Something the player can ask the game to do.
    slots: [id]
    attributes:
      kind:
        description: Whether the action is held or pressed.
        range: ActionKind
        required: true
      bindings:
        description: The inputs that trigger the action. Any one of them is enough.
        range: Binding
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1

  Binding:
    description: One physical input on one device.
    attributes:
      device:
        description: The device the input is on.
        range: InputDevice
        required: true
      key:
        description: The keyboard key. Set only for the keyboard.
        range: PhysicalKey
      button:
        description: The mouse button. Set only for the mouse.
        range: MouseButton
    rules:
      - description: A keyboard binding names a key and no button.
        preconditions:
          slot_conditions:
            device:
              equals_string: keyboard
        postconditions:
          slot_conditions:
            key:
              required: true
            button:
              value_presence: ABSENT
      - description: A mouse binding names a button and no key.
        preconditions:
          slot_conditions:
            device:
              equals_string: mouse
        postconditions:
          slot_conditions:
            button:
              required: true
            key:
              value_presence: ABSENT

  Tuning:
    tree_root: true
    description: >-
      Which number. Constants that shape how the game feels and that are not
      properties of anything in the universe.
    attributes:
      flight:
        description: Constants of ship flight and of a ship as a target.
        range: FlightTuning
        required: true
        inlined: true
      loot:
        description: Constants of loot collection.
        range: LootTuning
        required: true
        inlined: true
      enemy_ai:
        description: Constants of enemy behaviour.
        range: EnemyAiTuning
        required: true
        inlined: true

  FlightTuning:
    description: Constants of ship flight and of a ship as a target.
    attributes:
      drag_fraction:
        description: >-
          Deceleration of a ship without throttle, as a fraction of its ship
          class acceleration.
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
      arrival_distance_fraction:
        description: >-
          Distance of the arrival point from the star, on the +Z axis, as a
          fraction of the system bounds radius.
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
      ship_hit_radius:
        description: Radius of the sphere within which a bolt hits a ship.
        range: Distance
        required: true
      muzzle_clearance:
        description: How far beyond the shooter's hit radius, along its nose, a bolt starts.
        range: Distance
        required: true

  LootTuning:
    description: Constants of loot collection.
    attributes:
      pickup_radius:
        description: Distance from the player ship within which a loot drop is collected.
        range: Distance
        required: true
      magnet_radius:
        description: Distance from the player ship within which a loot drop is pulled toward it.
        range: Distance
        required: true
      magnet_speed:
        description: Speed at which a pulled loot drop moves toward the player ship.
        range: Speed
        required: true

  EnemyAiTuning:
    description: Constants of enemy behaviour.
    attributes:
      keep_distance:
        description: Distance from the player ship at which an engaged enemy stops thrusting.
        range: Distance
        required: true
      aim_cone:
        description: >-
          Largest angle, in radians, between an enemy's nose and the direction
          of the player ship at which the enemy fires.
        range: float
        required: true
        minimum_value: 0
      steering_gain:
        description: >-
          Pitch and yaw input an enemy applies per unit of sideways offset of
          the player ship's direction, before clamping to full input.
        range: float
        required: true
        minimum_value: 0

  CameraRig:
    tree_root: true
    description: How the game is framed. The chase camera behind the player ship.
    attributes:
      offset:
        description: Position of the camera in the ship's own frame (+Y above, +Z behind).
        range: Vector3D
        required: true
        inlined: true
      fov_degrees:
        description: Vertical field of view, in degrees.
        range: float
        required: true
        minimum_value: 0
      far_plane:
        description: Distance beyond which nothing is drawn.
        range: Distance
        required: true
      follow_rate:
        description: >-
          Rate, per second, at which the camera closes the gap to its offset
          position (exponential smoothing).
        range: float
        required: true
        minimum_value: 0
      aim:
        description: Where the camera looks.
        range: CameraAim
        required: true

enums:

  ActionKind:
    description: How an action responds to its input.
    permissible_values:
      hold:
        description: Active for as long as the input is held.
      press:
        description: Fires once each time the input is pressed.

  InputDevice:
    description: A device the player gives input with.
    permissible_values:
      keyboard:
      mouse:

  PhysicalKey:
    description: >-
      A keyboard key by physical position, named by its W3C UI Events `code`
      value, so the binding does not depend on the keyboard layout. Lists only
      the keys in use.
    permissible_values:
      KeyW:
      KeyS:
      KeyA:
      KeyD:
      KeyQ:
      KeyE:
      KeyJ:
      ArrowUp:
      ArrowDown:
      Space:
      Tab:

  MouseButton:
    description: A mouse button. Lists only the buttons in use.
    permissible_values:
      left:

  CameraAim:
    description: Where the camera looks.
    permissible_values:
      parallel_to_nose:
        description: >-
          Parallel to the ship's nose, so that shots fly toward the screen
          centre at any range.

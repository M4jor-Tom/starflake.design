---
id: https://w3id.org/M4jor-Tom/starflake-design/tuning
name: starflake-design-tuning
title: "Starflake design: tuning"
description: "Which number: constants that shape how the game feels."

prefixes:
  starflake_design: https://w3id.org/M4jor-Tom/starflake-design/
  linkml: https://w3id.org/linkml/
default_prefix: starflake_design
default_range: string

imports:
  - linkml:types
  - ../.ontology/src/starflake_ontology/schema/starflake_ontology

classes:

  Tuning:
    tree_root: true
    description: >-
      Which number. Constants that shape how the game feels and that are not
      properties of anything in the universe.
    attributes:
      flight:
        description: Constants of ship flight and of a ship as a target.
        range: FlightTuning
        required: true
        inlined: true
      raider_ai:
        description: Constants of raider behaviour.
        range: RaiderAiTuning
        required: true
        inlined: true

  FlightTuning:
    description: Constants of ship flight and of a ship as a target.
    attributes:
      drag_fraction:
        description: >-
          Deceleration of a ship without throttle, as a fraction of its ship
          class acceleration.
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
      arrival_distance_fraction:
        description: >-
          Distance of the arrival point from the star, on the +Z axis, as a
          fraction of the system bounds radius.
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
      ship_hit_radius:
        description: Radius of the sphere within which a projectile hits a ship.
        range: Distance
        required: true
      muzzle_clearance:
        description: How far beyond the shooter's hit radius, along its nose, a projectile starts.
        range: Distance
        required: true

  RaiderAiTuning:
    description: Constants of raider behaviour.
    attributes:
      aim_cone:
        description: >-
          Angle, in radians, between a raider's nose and the direction
          of the pilot ship below which the raider fires.
        range: float
        required: true
        minimum_value: 0
      steering_gain:
        description: >-
          Pitch and yaw input a raider applies per unit of sideways offset of
          the pilot ship's direction, before clamping to full input. Greater
          than zero.
        range: float
        required: true
        minimum_value: 0

message_duration_seconds: 4
number_decimals: 0
readouts:
  - id: system
    anchor: top_left
    text: "{system_name}  ·  class {star_class} star"
  - id: hull
    anchor: top_left
    text: "Hull  {hull} / {max_hull}"
  - id: fuel
    anchor: top_left
    text: "Fuel  {fuel} / {fuel_capacity}"
  - id: fuel_tank_full
    anchor: top_left
    text: "Fuel  {fuel} / {fuel_capacity}  (full)"
  - id: jump_route_ready
    anchor: top_left
    text: "Jump to {target_name}: READY, press J"
  - id: jump_route_fuel_short
    anchor: top_left
    text: "Jump to {target_name}: {fuel_missing} more fuel needed"
  - id: jump_route_none
    anchor: top_left
    text: "No jump route"
  - id: counts
    anchor: top_left
    text: "Asteroids {asteroid_count}  ·  Enemies {enemy_count}  ·  Fuel drops {loot_count}"
  - id: crosshair
    anchor: center
    text: "+"
  - id: controls_help
    anchor: bottom_center
    text: "W/S thrust  ·  A/D yaw  ·  ↑/↓ pitch  ·  Q/E roll  ·  Space or click fire  ·  Tab next jump target  ·  J jump"
messages:
  - id: welcome
    text: "Shoot asteroids and pirates, collect their fuel, then jump."
  - id: jumped
    text: "Jumped to {target_name}."
  - id: jump_refused
    text: "Jumping out of {system_name} costs {jump_fuel_cost} fuel."
  - id: ship_destroyed
    text: "Ship destroyed. Repaired at the arrival point, fuel kept."
